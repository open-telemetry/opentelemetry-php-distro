---
name: release


on:
  push:
    tags: [ "v*" ]
    branches:
      - main

env:
  BUILT_PACKAGES_DIR: _BUILT/packages

permissions:
  contents: read

jobs:

  verify-tag:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.get_tag.outputs.tag_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: get_tag
        run: |
          source ./tools/read_properties.sh
          read_properties project.properties PROJECT_PROPERTIES

          TAG_NAME="${GITHUB_REF#refs/tags/}"
          EXPECTED_TAG="v${PROJECT_PROPERTIES_VERSION}"

          if [[ "${TAG_NAME}" != "${EXPECTED_TAG}" ]]; then
            echo "Tag (${TAG_NAME}) does not match project.properties version (${EXPECTED_TAG})."
            exit 1
          fi

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

  build:
    needs:
      - verify-tag
    uses: ./.github/workflows/build.yml
    secrets:
      DOCKER_TOKEN_PHP_DISTRO: ${{ secrets.DOCKER_TOKEN_PHP_DISTRO }}
    with:
      build_arch: 'all'

  release:
    needs:
      - verify-tag
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TAG_NAME: ${{ needs.verify-tag.outputs.tag_name }}
    steps:
      - name: Validate GitHub token
        run: |
          if [ -z "${GITHUB_TOKEN}" ]; then
            echo "Please set GITHUB_TOKEN in the environment to perform a release"
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Download package artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: packages-*
          path: ${{ env.BUILT_PACKAGES_DIR }}
      - name: Moving packages out of folders
        run: |
          pushd ${{ env.BUILT_PACKAGES_DIR }}
          find . -mindepth 2 -type f -exec mv -t . {} +
          find . -mindepth 1 -maxdepth 1 -type d -exec rm -r {} +
          popd
          ls -R ${{ env.BUILT_PACKAGES_DIR }}

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags')
        run: |
          RNOTES=$(./tools/build/get_release_note.sh --release-tag ${TAG_NAME})
          gh release create "${TAG_NAME}" --draft --title "${TAG_NAME}" --repo open-telemetry/opentelemetry-php-distro \
            --notes "${RNOTES}" \
            ${{ env.BUILT_PACKAGES_DIR }}/*.*
      - name: Verify sha512 sums
        if: startsWith(github.ref, 'refs/tags')
        run: |
          mkdir -p packages_downloaded_from_github
          pushd packages_downloaded_from_github
            for attempt in $(seq 1 3); do
              gh release download "${TAG_NAME}" && break || (echo "Download draft release assets attempt ${attempt}/3 failed. Waiting 60s." && sleep 60)
            done
            ls -l .
            echo "Verifying that downloaded artifacts pass the downloaded checksums..."
            sha512sum --check ./*.sha512
          popd

          sort "${BUILT_PACKAGES_DIR}/"*.sha512 > original_artifacts.sha512
          sort "packages_downloaded_from_github/"*.sha512 > downloaded_artifacts.sha512

          cat original_artifacts.sha512
          cat downloaded_artifacts.sha512

          echo "Verifying that original and downloaded artifacts have the same checksums..."
          diff original_artifacts.sha512 downloaded_artifacts.sha512 || exit 1
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags')
        run: gh release edit "${TAG_NAME}" --draft=false

  # Runs after the release is public, so a failed push leaves a release without an image
  # (fixed by rerunning this job) rather than a public image without a release.
  publish-image:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io with GITHUB_TOKEN
      id-token: write # cosign keyless signing gets its certificate with the workflow's OIDC token
    strategy:
      fail-fast: false
      matrix:
        libc: [ glibc, musl ]
    # Two overlapping releases could otherwise both pick the floating tags, and the older push
    # could land last. Serialised, the second run reads the release list after the first finishes.
    concurrency:
      group: publish-image-${{ matrix.libc }}
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{ github.token }}
      IMAGE: ghcr.io/${{ github.repository }}
      LIBC: ${{ matrix.libc }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Download package artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: packages-*
          path: ${{ env.BUILT_PACKAGES_DIR }}
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Build and push image
        run: |
          source ./tools/read_properties.sh
          read_properties project.properties PROJECT_PROPERTIES

          released_versions=$(gh release list --repo "${GITHUB_REPOSITORY}" --exclude-drafts --exclude-pre-releases \
            --limit 1000 --json tagName --jq '.[].tagName | ltrimstr("v")')
          # Captured first, because a failure inside a process substitution doesn't stop the step.
          tags=$(./tools/build/image_tags.sh --image "${IMAGE}" --version "${PROJECT_PROPERTIES_VERSION}" --libc "${LIBC}" \
            --released_versions "${released_versions}")
          tag_args=()
          while read -r tag; do
            tag_args+=(--tag "${tag}")
          done <<< "${tags}"

          ./tools/build/build_image.sh --libc "${LIBC}" "${tag_args[@]}" \
            --packages_dir "${BUILT_PACKAGES_DIR}" \
            --platforms linux/amd64,linux/arm64 \
            --push \
            --metadata_file image-metadata.json
      - name: Sign image
        run: |
          digest=$(jq -r '."containerimage.digest"' image-metadata.json)
          cosign sign --yes "${IMAGE}@${digest}"
