---

name: verify-composer-version-is-pinned

on:
  workflow_call: ~
  workflow_dispatch: ~

permissions:
  contents: read

jobs:
  verify-composer-version-is-pinned:
    name: verify-composer-version-is-pinned
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Verify the Composer version is specified only in project.properties
        run: ./tools/build/verify_composer_version_is_pinned.sh
