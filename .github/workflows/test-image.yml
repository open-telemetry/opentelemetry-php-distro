---

name: test-image

on:
  workflow_call: ~

permissions:
  contents: read

env:
  BUILT_PACKAGES_DIR: _BUILT/packages
  OTEL_PHP_NTS_IMAGE_CACHE_DIR: _BUILT/php_nts_image_cache

jobs:
  generate-php-versions:
    uses: ./.github/workflows/generate-php-versions.yml

  test-image:
    name: test-image
    needs: generate-php-versions
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [ amd64, arm64 ]
        libc: [ glibc, musl ]
        php-version: ${{ fromJson(needs.generate-php-versions.outputs.php-versions).include.*.php-version }}
    env:
      LIBC: ${{ matrix.libc }}
      PHP_VERSION_NO_DOT: ${{ matrix.php-version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: packages-${{ matrix.libc == 'musl' && 'linuxmusl' || 'linux' }}-${{ matrix.arch == 'arm64' && 'arm64' || 'x86-64' }}
          path: ${{ env.BUILT_PACKAGES_DIR }}
      - name: Cache own NTS PHP docker image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.OTEL_PHP_NTS_IMAGE_CACHE_DIR }}
          key: php-nts-image-${{ runner.arch }}-${{ matrix.arch || 'host' }}-${{ matrix.libc || 'all' }}-${{ hashFiles('tools/test/php_nts/**') }}
      - name: Build image
        run: ./tools/build/build_image.sh --libc "${LIBC}" --tag "opentelemetry-php-distro:test-${LIBC}" --packages_dir "${BUILT_PACKAGES_DIR}"
      - name: Test image in php-cli
        run: |
          source ./tools/shared.sh
          ./tools/test/image/test_image.sh --image "opentelemetry-php-distro:test-${LIBC}" --libc "${LIBC}" --sapi cli \
              --php_version "$(convert_no_dot_to_dot_separated_version "${PHP_VERSION_NO_DOT}")"
      - name: Test image in php-fpm
        run: |
          source ./tools/shared.sh
          ./tools/test/image/test_image.sh --image "opentelemetry-php-distro:test-${LIBC}" --libc "${LIBC}" --sapi fpm \
              --php_version "$(convert_no_dot_to_dot_separated_version "${PHP_VERSION_NO_DOT}")"
