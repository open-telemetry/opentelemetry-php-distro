version=0.7.0
supported_php_versions=(81 82 83 84 85)
supported_package_types=(apk deb rpm)
test_all_php_versions_with_package_type=deb
test_app_code_host_kinds_short_names=(cli http)
test_groups_short_names=(no_ext_svc with_ext_svc)
php_headers_version=2.0
# The lock files under generated_lock_files_folder are only valid for the Composer release that
# produced them: Composer 2.11.0 changed how the lock content hash is computed, so a newer Composer
# rejects them with "The lock file is not up to date with the latest changes in composer.json".
# Regenerate the lock files (tools/build/generate_composer_lock_files.sh) before raising this.
composer_version=2.8.12
logger_features_enum_values=ALL=0,MODULE=1,REQUEST=2,TRANSPORT=3,BOOTSTRAP=4,HOOKS=5,INSTRUMENTATION=6,OTEL=7,DEPGUARD=8,OTLPEXPORT=9,OPAMP=10,CONFIG=11,COORDINATOR=12
otel_proto_version=v1.8.0
otel_semconv_version=1.38.0
otel_weaver_version=0.23.0
otel_opamp_proto_version=v0.12.0
native_otlp_exporters_based_on_php_impl_version=1.4.0
php_scoper_prefix=OTelDistroScoped
generated_lock_files_folder=generated_composer_lock_files
# Make sure the following value is in sync with the rest of locations where it's used:
#   - tools/build/AdaptPackagesToPhp81.php
packages_adapted_to_PHP_81_rel_path=build/adapted_to_PHP_81/packages
composer_home_for_packages_adapted_to_PHP_81_rel_path=build/adapted_to_PHP_81/composer_home
