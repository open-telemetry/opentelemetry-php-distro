; OpenTelemetry PHP Distro, from the container image.
; Copy this file into PHP's conf.d directory. To change settings, add another
; ini file that sorts after it, see opentelemetry_distro_custom_template.ini.
;
; Packaged installs generate the same settings in add_extension_configuration()
; in packaging/scripts/post-install.sh. Keep the two in sync.
[opentelemetry_distro]
extension=/opt/opentelemetry/php/distro/opentelemetry_php_distro_loader.so
opentelemetry_distro.bootstrap_php_part_file=/opt/opentelemetry/php/distro/php/bootstrap_php_part.php
